<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — JadeOS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="windows.css">
    <link rel="stylesheet" href="responsive.css">
</head>

<body>

    <main class="desktop">

        <div class="desktop-icons">

            <a href="index.html" class="desktop-icon">
                <span class="desktop-icon-image">🍓</span>
                <span>Home</span>
            </a>

            <a href="work.html" class="desktop-icon">
                <span class="desktop-icon-image">📁</span>
                <span>My Work</span>
            </a>

            <a href="about.html" class="desktop-icon">
                <span class="desktop-icon-image">💌</span>
                <span>About Me</span>
            </a>

            <a href="guestbook.html" class="desktop-icon">
                <span class="desktop-icon-image">📖</span>
                <span>Guestbook</span>
            </a>

        </div>


        <section class="window welcome-window" id="welcome-window">

            <div class="titlebar">

                <div class="titlebar-title">
                    ✉️ Contact Me
                </div>

                <div class="window-controls">
                    <button class="window-control minimize" aria-label="Minimize">−</button>
                    <button class="window-control maximize" aria-label="Maximize">□</button>
                    <button class="window-control close" aria-label="Close">×</button>
                </div>

            </div>


            <div class="window-content welcome-content">

                <div class="welcome-strawberry">
                    💌
                </div>

                <p class="eyebrow">
                    SAY HELLO!
                </p>

                <h1>Let's chat ♡</h1>

                <p class="welcome-text">
                    Want to talk about design, collaborate on something,
                    or just say hi? I'd love to hear from you!
                </p>

                <div class="welcome-buttons">

                    <a href="mailto:your-email@example.com" class="button primary-button">
                        Send me an email →
                    </a>

                    <a href="guestbook.html" class="button secondary-button">
                        Sign my guestbook ♡
                    </a>

                </div>

            </div>

        </section>


        <footer class="taskbar">

            <button class="start-button" id="start-button">
                🍓 Start
            </button>

            <div class="taskbar-divider"></div>

            <div class="taskbar-spacer"></div>

            <div class="taskbar-clock" id="clock">
                12:00 PM
            </div>

        </footer>

    </main>


    <script src="desktop.js"></script>
    <script src="windows.js"></script>
    <script src="effects.js"></script>

</body>
</html>
