<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook — JadeOS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="windows.css">
    <link rel="stylesheet" href="responsive.css">
</head>

<body>

    <main class="desktop">

        <div class="desktop-icons">

            <a href="index.html" class="desktop-icon">
                <span class="desktop-icon-image">🍓</span>
                <span>Home</span>
            </a>

            <a href="work.html" class="desktop-icon">
                <span class="desktop-icon-image">📁</span>
                <span>My Work</span>
            </a>

            <a href="about.html" class="desktop-icon">
                <span class="desktop-icon-image">💌</span>
                <span>About Me</span>
            </a>

            <a href="contact.html" class="desktop-icon">
                <span class="desktop-icon-image">✉️</span>
                <span>Contact</span>
            </a>

        </div>


        <section class="window guestbook-window" id="guestbook-window">

            <div class="titlebar">

                <div class="titlebar-title">
                    📖 Guestbook
                </div>

                <div class="window-controls">
                    <button class="window-control minimize" aria-label="Minimize">−</button>
                    <button class="window-control maximize" aria-label="Maximize">□</button>
                    <button class="window-control close" aria-label="Close">×</button>
                </div>

            </div>


            <div class="window-content guestbook-content">

                <div class="page-header">

                    <p class="eyebrow">
                        LEAVE A LITTLE NOTE
                    </p>

                    <h1>Guestbook ♡</h1>

                    <p>
                        Say hi, leave a little message, or tell me what you think!
                    </p>

                </div>


                <form class="guestbook-form" id="guestbook-form">

                    <div class="form-group">

                        <label for="guest-name">
                            Your name
                        </label>

                        <input
                            type="text"
                            id="guest-name"
                            name="name"
                            maxlength="30"
                            placeholder="Strawberry lover..."
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="guest-message">
                            Your message
                        </label>

                        <textarea
                            id="guest-message"
                            name="message"
                            maxlength="200"
                            placeholder="Write something sweet ♡"
                            required
                        ></textarea>

                        <div class="character-count" id="character-count">
                            0 / 200
                        </div>

                    </div>


                    <button type="submit" class="button primary-button">
                        Sign the guestbook 🍓
                    </button>

                </form>


                <div class="guestbook-divider">
                    ♡ ♡ ♡
                </div>


                <div class="guestbook-list-header">

                    <h2>
                        Little notes
                    </h2>

                    <span id="guestbook-count">
                        0 entries
                    </span>

                </div>


                <div class="guestbook-entries" id="guestbook-entries">

                    <div class="empty-guestbook" id="empty-guestbook">

                        <span>🍓</span>

                        <p>
                            No notes yet!
                            Be the first to leave one. ♡
                        </p>

                    </div>

                </div>


                <div class="page-footer">

                    <a href="index.html" class="button secondary-button">
                        ← Back home
                    </a>

                </div>

            </div>

        </section>


        <footer class="taskbar">

            <button class="start-button" id="start-button">
                🍓 Start
            </button>

            <div class="taskbar-divider"></div>

            <div class="taskbar-spacer"></div>

            <div class="taskbar-clock" id="clock">
                12:00 PM
            </div>

        </footer>

    </main>


    <script src="desktop.js"></script>
    <script src="windows.js"></script>
    <script src="guestbook.js"></script>
    <script src="effects.js"></script>

</body>
</html>
